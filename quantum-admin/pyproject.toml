[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-admin"
version = "0.1.0"
description = "Quantum Admin - CrewAI Multi-Agent System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.11.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "requests==2.31.0",
    "aiohttp==3.9.5",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "asyncio-throttle==1.0.2",
    "tenacity==8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "black==24.10.0",
    "ruff==0.7.3",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_admin*"]

[tool.setuptools.package-dir]
"" = "src"